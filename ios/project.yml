name: Igrice
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  Igrice:
    type: application
    platform: iOS
    sources:
      - Igrice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brunodobric.igrice
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: XO Igrice
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  IgriceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - IgriceTests
    dependencies:
      - target: Igrice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brunodobric.igrice.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Igrice:
    build:
      targets:
        Igrice: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IgriceTests
