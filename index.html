<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <!-- Zabranjen zoom na mobitelu -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Igrice</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Icons -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">

  <!-- iOS / Apple "Add to Home Screen" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Igrice">
  <meta name="application-name" content="Igrice">
  <meta name="theme-color" content="#0d1321">
  <meta name="msapplication-TileColor" content="#0d1321">
  <meta name="msapplication-TileImage" content="icon-192.png">

  <!-- tema se postavlja prije prikaza da nema treptanja -->
  <script>
    (function () {
      var light = false;
      try {
        var p = localStorage.getItem('igrice-theme') || 'auto';
        light = p === 'light' || (p === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches);
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
    })();
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ---------- Teme ---------- */
    :root {
      color-scheme: dark;
      --bg: #0d1321;
      --surf: #182036;
      --surf2: #222c47;
      --line: #2e3a5c;
      --text: #f1f4fa;
      --muted: #a3aecb;
      --accent: #ff5d73;
      --on-accent: #0d1321;
      --cyan: #4cc9f0;
      --gold: #ffc145;
      --sun: #ffc145;
      --hidden: #2a3552;
      --open: #0f1628;
      --good: #5be49b;
      --glass: rgba(255,255,255,0.07);
      --glass-line: rgba(255,255,255,0.14);
      --glass-on: rgba(255,255,255,0.20);
      --nav-glass: rgba(22,30,52,0.72);
      --nav-shadow: rgba(0,0,0,0.45);
      --scrim: rgba(5,8,16,0.62);
      --statusbar: transparent;
      --n1: #4cc9f0; --n2: #5be49b; --n3: #ff5d73; --n4: #b892ff;
      --n5: #ffc145; --n6: #3dd6c6; --n7: #f1f4fa; --n8: #a3aecb;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f3f5fa;
      --surf: #ffffff;
      --surf2: #e6eaf3;
      --line: #d5dbe8;
      --text: #141a2b;
      --muted: #56607a;
      --accent: #c92e4a;
      --on-accent: #ffffff;
      --cyan: #0878a0;
      --gold: #a66c00;
      --sun: #e9a21b;
      --hidden: #d5dbe8;
      --open: #f3f5fa;
      --good: #1e8a5c;
      --glass: rgba(255,255,255,0.70);
      --glass-line: rgba(20,26,43,0.10);
      --glass-on: rgba(20,26,43,0.10);
      --nav-glass: rgba(255,255,255,0.72);
      --nav-shadow: rgba(20,26,43,0.16);
      --scrim: rgba(20,26,43,0.38);
      --statusbar: #141a2b;
      --n1: #0878a0; --n2: #1e8a5c; --n3: #c92e4a; --n4: #6b3fc9;
      --n5: #a66c00; --n6: #0e7c86; --n7: #141a2b; --n8: #56607a;
    }

    /* Ispuni cijeli ekran (uklj. iPhone safe area); ništa se ne scrolla */
    html {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: var(--bg);
    }

    body {
      position: fixed;
      inset: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      --hud-h: calc(env(safe-area-inset-top, 0px) + 62px);
      --nav-h: calc(env(safe-area-inset-bottom, 0px) + 82px);
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* traka iza statusne trake iPhonea (PWA) – u svijetloj temi tamna da se sat vidi */
    .safe-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: env(safe-area-inset-top, 0px);
      background: var(--statusbar);
      z-index: 30;
    }

    /* ---------- Gornji red: postavke · brojke · upute ---------- */
    .hud {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: 0; right: 0;
      margin: 0 auto;
      width: min(100%, 520px);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px 8px;
      z-index: 20;
    }

    .round-btn {
      flex: none;
      width: 44px; height: 44px;
      padding: 0;
      border-radius: 50%;
      background: var(--glass);
      border: 1px solid var(--glass-line);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      backdrop-filter: blur(20px) saturate(160%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0;
      transition: transform 0.15s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .round-btn svg { display: block; }
    #btn-info { color: var(--cyan); }
    .round-btn[aria-expanded="true"] { background: var(--glass-on); }

    .stats {
      flex: 1;
      min-width: 0;
      height: 44px;
      border-radius: 22px;
      background: var(--glass);
      border: 1px solid var(--glass-line);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      backdrop-filter: blur(20px) saturate(160%);
      display: flex;
      align-items: center;
      padding: 0 4px;
    }

    .stat-group { display: none; flex: 1; align-items: center; justify-content: space-around; }
    body[data-game="ttt"]   .stat-group[data-for="ttt"],
    body[data-game="tango"] .stat-group[data-for="tango"],
    body[data-game="mines"] .stat-group[data-for="mines"],
    body[data-game="sky"]   .stat-group[data-for="sky"] { display: flex; }

    .stat {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 5px 12px;
      border-radius: 16px;
      border: 1.5px solid transparent;
      font-size: 16px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      transition: background 0.2s, border-color 0.2s;
    }
    .stat svg { flex: none; display: block; }
    .stat .sym { font-size: 17px; font-weight: 800; line-height: 1; }
    .stat.x-stat .sym { color: var(--accent); }
    .stat.o-stat .sym { color: var(--cyan); }
    .stat.draw-stat .sym { color: var(--gold); }
    .stat.time-stat svg { color: var(--cyan); }
    .stat.best-stat { color: var(--gold); }
    .stat.mine-stat svg { color: var(--accent); }
    /* igrač na potezu */
    .stat.active { background: var(--glass-on); border-color: var(--text); }
    .stat.x-stat.active { border-color: var(--accent); }
    .stat.o-stat.active { border-color: var(--cyan); }

    .mono { font-variant-numeric: tabular-nums; }

    /* ---------- Prostor za igru (između gornjeg reda i donje trake) ---------- */
    .stage {
      position: fixed;
      left: 0; right: 0;
      top: var(--hud-h);
      bottom: var(--nav-h);
      overflow: hidden;
    }

    .game {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 0 12px;
    }
    .game.hidden { display: none; }

    .actions {
      display: flex;
      gap: 10px;
      height: 48px;
      width: 100%;
      max-width: 420px;
    }

    .pill-btn {
      flex: 1;
      min-width: 0;
      padding: 0 1rem;
      border-radius: 24px;
      background: var(--glass);
      border: 1px solid var(--glass-line);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .fab {
      flex: none;
      width: 48px; height: 48px;
      padding: 0;
      border-radius: 50%;
      background: var(--accent);
      color: var(--on-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .fab svg { display: block; }

    /* segmentirani prekidač (razina, tema, način igre) */
    .seg {
      flex: 1;
      display: flex;
      gap: 3px;
      padding: 3px;
      border-radius: 14px;
      background: var(--bg);
      border: 1px solid var(--line);
    }
    .seg button {
      flex: 1;
      padding: 0.55rem 0.4rem;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0;
    }
    .seg button.active { background: var(--surf); color: var(--text); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,0.18); }
    .actions .seg { border-radius: 24px; background: var(--glass); border-color: var(--glass-line); }
    .actions .seg button { border-radius: 21px; font-size: 15px; }
    .actions .seg button.active { background: var(--surf2); box-shadow: none; }

    /* ---------- Ploče ---------- */
    .board, .t-board, .m-board, .sky-board {
      background: var(--surf);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    /* Križić Kružić */
    .board {
      display: grid;
      grid-template-columns: repeat(3, auto);
      gap: 10px;
      padding: 15px;
    }

    .cell {
      --s: var(--ttt-cell, 90px);
      width: var(--s);
      height: var(--s);
      border-radius: 16px;
      background: var(--open);
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: calc(var(--s) * 0.5);
      font-weight: 800;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .cell:hover:not(.taken) { border-color: var(--line); }
    .cell.taken { cursor: default; }

    .cell.x {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 40%, transparent);
      background: color-mix(in srgb, var(--accent) 9%, var(--open));
    }

    .cell.o {
      color: var(--cyan);
      border-color: color-mix(in srgb, var(--cyan) 40%, transparent);
      background: color-mix(in srgb, var(--cyan) 9%, var(--open));
    }

    .cell.winner { animation: pulse-win 0.6s ease-in-out infinite alternate; }

    .cell.x.winner {
      background: color-mix(in srgb, var(--accent) 22%, var(--open));
      border-color: var(--accent);
      box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 50%, transparent);
    }

    .cell.o.winner {
      background: color-mix(in srgb, var(--cyan) 22%, var(--open));
      border-color: var(--cyan);
      box-shadow: 0 0 18px color-mix(in srgb, var(--cyan) 50%, transparent);
    }

    @keyframes pulse-win {
      from { transform: scale(1); }
      to   { transform: scale(1.06); }
    }

    .cell.pop, .t-cell.pop {
      animation: pop 0.25s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    @keyframes pop {
      0%   { transform: scale(0.5); opacity: 0.4; }
      70%  { transform: scale(1.12); }
      100% { transform: scale(1);   opacity: 1;   }
    }

    /* Tango */
    .t-board {
      position: relative;
      display: grid;
      gap: 6px;
      padding: 10px;
    }

    .t-cell {
      border-radius: 10px;
      background: var(--open);
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 2.2rem;
      line-height: 1;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      user-select: none;
    }

    .t-cell:hover:not(.given) { border-color: var(--line); }

    .t-cell.given { cursor: default; background: var(--surf2); }

    .t-cell.sun  { color: var(--sun); }
    .t-cell.moon { color: var(--cyan); }

    .t-cell.error {
      border-color: var(--accent);
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 45%, transparent);
      background: color-mix(in srgb, var(--accent) 12%, var(--open));
    }

    .t-cell.solved {
      border-color: color-mix(in srgb, var(--cyan) 60%, transparent);
      box-shadow: 0 0 14px color-mix(in srgb, var(--cyan) 35%, transparent);
    }

    /* znakovi = i × između polja */
    .t-marker {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1;
      background: var(--bg);
      border: 1.5px solid var(--muted);
      color: var(--text);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
    }

    .t-marker.bad {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 50%, transparent);
    }

    /* Minolovac */
    .m-board {
      display: grid;
      gap: 2px;
      padding: 6px;
      --m-size: 20px;
    }

    .m-cell {
      width: var(--m-size);
      height: var(--m-size);
      border-radius: 4px;
      background: var(--hidden);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: calc(var(--m-size) * 0.55);
      font-weight: 800;
      line-height: 1;
      user-select: none;
      transition: background 0.1s;
    }

    .m-cell:hover:not(.revealed) { background: color-mix(in srgb, var(--hidden) 80%, var(--text)); }

    .m-cell.revealed { background: var(--open); cursor: default; }

    .m-cell.flag { color: var(--accent); }

    .m-cell.mine.revealed { background: color-mix(in srgb, var(--accent) 18%, var(--open)); }
    .m-cell.exploded {
      background: color-mix(in srgb, var(--accent) 60%, var(--open)) !important;
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 60%, transparent);
    }
    .m-cell.wrong { background: color-mix(in srgb, var(--accent) 14%, var(--hidden)); }

    .m-cell.n1 { color: var(--n1); }
    .m-cell.n2 { color: var(--n2); }
    .m-cell.n3 { color: var(--n3); }
    .m-cell.n4 { color: var(--n4); }
    .m-cell.n5 { color: var(--n5); }
    .m-cell.n6 { color: var(--n6); }
    .m-cell.n7 { color: var(--n7); }
    .m-cell.n8 { color: var(--n8); }

    /* Neboderi */
    .sky-board {
      display: grid;
      gap: 5px;
      padding: 10px;
    }

    .sky-clue {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--gold);
      user-select: none;
    }

    .sky-clue.bad {
      color: var(--accent);
      text-shadow: 0 0 10px color-mix(in srgb, var(--accent) 60%, transparent);
    }

    .sky-cell {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background: var(--open);
      border: 1.5px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--text);
      user-select: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .sky-cell:hover { border-color: var(--muted); }

    .sky-fill {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 0;
      background: var(--cyan);
      opacity: 0.25;
      z-index: 0;
      transition: height 0.2s;
    }

    .sky-cell span { position: relative; z-index: 1; }

    .sky-cell.error {
      border-color: var(--accent);
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 45%, transparent);
    }

    .sky-cell.solved {
      border-color: color-mix(in srgb, var(--cyan) 60%, transparent);
      box-shadow: 0 0 14px color-mix(in srgb, var(--cyan) 35%, transparent);
    }

    /* dodir: bez zumiranja dvostrukim dodirom, bez izbornika na dugi pritisak */
    .cell, .t-cell, .m-cell, .sky-cell {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    /* ---------- Gumbi ---------- */
    button {
      border: none;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
    }

    button:active { transform: scale(0.96); }

    .btn-restart {
      padding: 0.8rem 2.2rem;
      border-radius: 2rem;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 1rem;
      box-shadow: 0 4px 15px color-mix(in srgb, var(--accent) 40%, transparent);
    }

    /* ---------- Donja traka (plutajuća, poluprozirna) ---------- */
    .tabbar {
      position: fixed;
      left: 0; right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
      margin: 0 auto;
      width: min(calc(100% - 32px), 440px);
      height: 64px;
      padding: 5px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 2px;
      border-radius: 32px;
      background: var(--nav-glass);
      border: 1px solid var(--glass-line);
      -webkit-backdrop-filter: blur(24px) saturate(170%);
      backdrop-filter: blur(24px) saturate(170%);
      box-shadow: 0 10px 30px var(--nav-shadow);
      z-index: 20;
    }

    .tabbar button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 0;
      padding: 0 2px;
      border-radius: 27px;
      background: transparent;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0;
      white-space: nowrap;
    }
    .tabbar svg { display: block; }
    .tabbar button.active { background: var(--glass-on); color: var(--text); font-weight: 700; }
    .tabbar button.active svg { color: var(--accent); }

    /* ---------- Prozorčići: postavke i upute ---------- */
    .backdrop {
      position: fixed;
      inset: 0;
      background: var(--scrim);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 90;
    }
    .backdrop.open { opacity: 1; pointer-events: all; }

    .sheet {
      position: fixed;
      z-index: 91;
      width: min(calc(100% - 32px), 360px);
      max-height: calc(100% - var(--hud-h) - 24px);
      overflow-y: auto;
      background: var(--surf);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 16px 44px rgba(0,0,0,0.35);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px) scale(0.98);
      transition: opacity 0.2s, transform 0.2s;
    }
    .sheet.open { opacity: 1; pointer-events: all; transform: none; }

    #settings-sheet { top: var(--hud-h); left: max(16px, calc(50% - 260px + 16px)); transform-origin: top left; }
    #info-sheet { top: 50%; left: 50%; transform: translate(-50%, calc(-50% - 8px)) scale(0.98); }
    #info-sheet.open { transform: translate(-50%, -50%); }

    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sheet h2 { font-size: 19px; font-weight: 750; letter-spacing: 0; }
    .sheet-close {
      width: 32px; height: 32px; padding: 0;
      border-radius: 50%;
      background: var(--surf2);
      color: var(--muted);
      display: flex; align-items: center; justify-content: center;
    }

    .set-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .set-row:last-child { margin-bottom: 0; }
    .set-label { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
    .seg-hint { font-size: 12px; color: var(--muted); min-height: 1.3em; }
    .set-row .seg { flex: none; }
    #row-level { display: none; }
    .level-seg { display: none; }
    body[data-game="mines"] #row-level, body[data-game="sky"] #row-level { display: flex; }
    body[data-game="mines"] #m-levels, body[data-game="sky"] #sky-levels { display: flex; }
    body[data-game="mines"] #sky-levels, body[data-game="sky"] #m-levels { display: none; }

    .rules { list-style: none; display: flex; flex-direction: column; gap: 12px; counter-reset: r; }
    .rules li {
      counter-increment: r;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: 15px;
      line-height: 1.4;
    }
    .rules li::before {
      content: counter(r);
      flex: none;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--surf2);

<script>
/* ======================================================================
   GAME SWITCHER
   ====================================================================== */
const navButtons = document.querySelectorAll('nav.tabbar button');
const sections   = {
  ttt:   document.getElementById('game-ttt'),
  tango: document.getElementById('game-tango'),
  mines: document.getElementById('game-mines'),
  sky:   document.getElementById('game-sky')
};
let activeGame = 'ttt';
navButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    const game = btn.dataset.game;
    activeGame = game;
    document.body.dataset.game = game;
    closeSheets();
    navButtons.forEach(b => b.classList.toggle('active', b === btn));
    Object.entries(sections).forEach(([k, el]) => el.classList.toggle('hidden', k !== game));
    tttOverlay[game === 'ttt' ? 'resume' : 'suspend']();
    Tango[game === 'tango' ? 'onEnter' : 'onLeave']();
    Mines[game === 'mines' ? 'onEnter' : 'onLeave']();
    Sky[game === 'sky' ? 'onEnter' : 'onLeave']();
  });
});

/* ======================================================================
   TOUCH / RESPONSIVE HELPERS  (shared by all games)
   ====================================================================== */
// Prostor za ploču: prostor između gornjeg reda i donje trake, bez reda s gumbima.
const ACTIONS_H = 48 + 14;
function stageSize() {
  const st = document.getElementById('stage');
  return { w: Math.min(st.clientWidth - 24, 560), h: st.clientHeight - ACTIONS_H - 8 };
}

// Largest cell size (px) that lets a `cols` x `rows` board fit the free stage area,
// so no game ever needs scrolling. `pad` is the board's padding + border per side.
function boardFit(cols, maxCell, gap, pad, minCell, rows = cols) {
  const { w, h } = stageSize();
  const sw = Math.floor((w - (cols - 1) * gap - 2 * pad) / cols);
  const sh = Math.floor((h - (rows - 1) * gap - 2 * pad) / rows);
  return Math.max(minCell, Math.min(maxCell, sw, sh));
}

function fitTicTacToe() {
  document.documentElement.style.setProperty('--ttt-cell', boardFit(3, 130, 10, 16, 56) + 'px');
}

// Long-press = the "right-click" secondary action on touch devices. If the
// browser fires its own contextmenu on long-press (e.g. Android), we cancel
// ours so the module's contextmenu handler acts instead — avoids a double fire.
function addLongPress(el, action, delay = 600) {
  let timer = null, moved = false, done = false, sx = 0, sy = 0;
  el.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    moved = false; done = false;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    timer = setTimeout(() => { if (!moved) { done = true; action(); } }, delay);
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) { moved = true; clearTimeout(timer); }
  }, { passive: true });
  el.addEventListener('touchend', e => { clearTimeout(timer); if (done) e.preventDefault(); });
  el.addEventListener('touchcancel', () => clearTimeout(timer));
  el.addEventListener('contextmenu', () => clearTimeout(timer));
}

// Result overlay shown after a short delay. The pending show is cancelled by
// hide() (new game) and held back by suspend() while the game is not on screen,
// so it can never pop up over a fresh board or over another game.
function delayedOverlay(el) {
  let timer = null, pending = false;
  return {
    show(delay) {
      clearTimeout(timer);
      pending = true;
      timer = setTimeout(() => { timer = null; pending = false; el.classList.add('visible'); }, delay);
    },
    hide() {
      clearTimeout(timer); timer = null; pending = false;
      el.classList.remove('visible');
    },
    suspend() { clearTimeout(timer); timer = null; },
    resume() { if (pending && !timer) { pending = false; el.classList.add('visible'); } }
  };
}

/* ======================================================================
   KRIŽIĆ KRUŽIĆ
   ====================================================================== */
const WINS = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

let board   = Array(9).fill(null);
let current = 'X';
let gameOver = false;
let scores  = { X: 0, O: 0, D: 0 };

const cells      = document.querySelectorAll('#board .cell');
const statusEl   = document.getElementById('status');
const scoreX     = document.getElementById('score-x');
const scoreO     = document.getElementById('score-o');
const scoreDraw  = document.getElementById('score-draw');
const overlay    = document.getElementById('overlay');
const resultEmoji = document.getElementById('result-emoji');
const resultTitle = document.getElementById('result-title');
const resultSub   = document.getElementById('result-sub');
const tttOverlay  = delayedOverlay(overlay);

function setStatus() {
  if (current === 'X') {
    statusEl.innerHTML = `Na redu je <span class="highlight-x">Igrač 1 (✕)</span>`;
  } else {
    statusEl.innerHTML = `Na redu je <span class="highlight-o">Igrač 2 (○)</span>`;
  }
}

function checkWinner() {
  for (const [a,b,c] of WINS) {
    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
      return { winner: board[a], line: [a,b,c] };
    }
  }
  if (board.every(v => v)) return { winner: 'draw' };
  return null;
}

function highlightWinners(line) {
  line.forEach(i => cells[i].classList.add('winner'));
}

function showOverlay(winner) {
  if (winner === 'draw') {
    resultEmoji.textContent = '🤝';
    resultTitle.textContent = 'Remi!';
    resultSub.textContent   = 'Nitko nije pobijedio ovaj put.';
  } else {
    const name = winner === 'X' ? 'Igrač 1 (✕)' : 'Igrač 2 (○)';
    resultEmoji.textContent = winner === 'X' ? '🎉' : '🏆';
    resultTitle.textContent = `Pobijedio ${name}!`;
    resultSub.textContent   = 'Čestitke!';
  }
  tttOverlay.show(700);
}

function updateScoreCards() {
  scoreX.textContent    = scores.X;
  scoreO.textContent    = scores.O;
  scoreDraw.textContent = scores.D;
}

function setActiveCard() {
  document.getElementById('card-x').classList.toggle('active', current === 'X');
  document.getElementById('card-o').classList.toggle('active', current === 'O');
  document.getElementById('card-draw').classList.remove('active');
}

cells.forEach(cell => {
  cell.addEventListener('click', () => {
    const i = +cell.dataset.index;
    if (gameOver || board[i]) return;

    board[i] = current;
    cell.textContent = current === 'X' ? '✕' : '○';
    cell.classList.add(current.toLowerCase(), 'taken', 'pop');
    cell.addEventListener('animationend', () => cell.classList.remove('pop'), { once: true });

    const result = checkWinner();
    if (result) {
      gameOver = true;
      if (result.winner === 'draw') {
        scores.D++;
        statusEl.innerHTML = `<span style="color:#f0a500;font-weight:700">Remi!</span>`;
      } else {
        highlightWinners(result.line);
        const name = result.winner === 'X' ? 'Igrač 1 (✕)' : 'Igrač 2 (○)';
        scores[result.winner]++;
        statusEl.innerHTML = result.winner === 'X'
          ? `<span class="highlight-x">${name} pobijedio!</span>`
          : `<span class="highlight-o">${name} pobijedio!</span>`;
      }
      updateScoreCards();
      showOverlay(result.winner);
      return;
    }

    current = current === 'X' ? 'O' : 'X';
    setStatus();
    setActiveCard();
  });
});

function resetBoard() {
  board    = Array(9).fill(null);

/* ======================================================================
   TANGO
   ====================================================================== */
const Tango = (() => {
  const N = 6, NEED = 3;          // 6x6, 3 of each per row/col
  const SUN = 1, MOON = 2;
  const GLYPH = { [SUN]: '☀', [MOON]: '☾' };
  const BEST_KEY = 'tango-best-ms';

  const idx = (r, c) => r * N + c;
  const conKey = (a, b) => a < b ? a + '-' + b : b + '-' + a;
  const shuffle = arr => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };

  // DOM
  const boardEl   = document.getElementById('t-board');
  const timeEl    = document.getElementById('t-time');
  const bestEl    = document.getElementById('t-best');
  const statusEl  = document.getElementById('t-status');
  const overlayEl = document.getElementById('t-overlay');
  const finalTime = document.getElementById('t-final-time');
  const recordEl  = document.getElementById('t-record-badge');
  const finalSub  = document.getElementById('t-final-sub');
  const overlay   = delayedOverlay(overlayEl);

  // State
  let cellEls = [];              // 36 cell divs
  let markers = [];              // {a, b, type, el}
  let conMap  = {};              // "a-b" -> '=' | 'x'
  let given   = new Array(N * N).fill(0);
  let values  = new Array(N * N).fill(0);
  let solved  = false;
  let best    = null;
  let errorTimer = null;         // delayed error-highlight timer

  // Timer
  let started = false, running = false, stamp = 0, accrued = 0, ticker = null;

  function elapsed() { return accrued + (running ? Date.now() - stamp : 0); }
  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }
  function renderTime() { timeEl.textContent = fmt(elapsed()); }
  function startTimer() {
    if (running || solved) return;
    started = true; running = true; stamp = Date.now();
    ticker = setInterval(renderTime, 250);
  }
  function pauseTimer() {
    if (!running) return;
    accrued += Date.now() - stamp; running = false;
    clearInterval(ticker); ticker = null;
  }
  function resumeTimer() {
    if (running || solved || !started) return;
    running = true; stamp = Date.now();
    ticker = setInterval(renderTime, 250);
  }
  function resetTimer() {
    clearInterval(ticker); ticker = null;
    started = false; running = false; accrued = 0; stamp = 0;
    renderTime();
  }

  /* ---------- Solver helpers ---------- */
  // Validity of placing value v at (r,c) given board b + running counts.
  function ok(b, rowCnt, colCnt, r, c, v) {
    if (rowCnt[r][v] >= NEED) return false;
    if (colCnt[c][v] >= NEED) return false;
    // no three in a row (triple ending here)
    if (c >= 2 && b[idx(r, c - 1)] === v && b[idx(r, c - 2)] === v) return false;
    if (r >= 2 && b[idx(r - 1, c)] === v && b[idx(r - 2, c)] === v) return false;
    return true;
  }

  // Would placing value `v` at cell i break a rule against the CURRENT partial
  // board? Only certain (immediate) violations count — this is what makes a move
  // "forced" and therefore deducible without guessing.
  function forbidden(b, i, v, cons) {
    const r = Math.floor(i / N), c = i % N;
    const val = (rr, cc) => (rr < 0 || rr >= N || cc < 0 || cc >= N) ? -1 : b[idx(rr, cc)];

    // row / column already holds 3 of this value → a 4th is impossible
    let rc = 0, cc2 = 0;
    for (let k = 0; k < N; k++) { if (b[idx(r, k)] === v) rc++; if (b[idx(k, c)] === v) cc2++; }
    if (rc >= NEED || cc2 >= NEED) return true;

    // would complete three-in-a-row (as end, middle, or start of a triple)
    if (val(r, c - 1) === v && val(r, c - 2) === v) return true;
    if (val(r, c - 1) === v && val(r, c + 1) === v) return true;
    if (val(r, c + 1) === v && val(r, c + 2) === v) return true;
    if (val(r - 1, c) === v && val(r - 2, c) === v) return true;
    if (val(r - 1, c) === v && val(r + 1, c) === v) return true;
    if (val(r + 1, c) === v && val(r + 2, c) === v) return true;

    // = / × constraints against already-filled neighbours
    const nb = [[r, c - 1], [r, c + 1], [r - 1, c], [r + 1, c]];
    for (const [nr, ncc] of nb) {
      if (nr < 0 || nr >= N || ncc < 0 || ncc >= N) continue;
      const j = idx(nr, ncc), t = cons[conKey(i, j)], nv = b[j];
      if (t && nv) { if (t === '=' ? nv !== v : nv === v) return true; }
    }
    return false;
  }

  // Solve using ONLY forced moves (a cell where one of the two symbols is
  // impossible). Returns true only if the whole board fills in this way — i.e.
  // the puzzle is solvable by pure logic, no guessing required.
  function logicSolve(givens, cons) {
    const b = givens.slice();
    let changed = true;
    while (changed) {
      changed = false;
      for (let i = 0; i < N * N; i++) {
        if (b[i]) continue;
        const canSun  = !forbidden(b, i, SUN, cons);
        const canMoon = !forbidden(b, i, MOON, cons);
        if (!canSun && !canMoon) return false;   // contradiction
        if (canSun !== canMoon) { b[i] = canSun ? SUN : MOON; changed = true; }
      }
    }
    return b.every(v => v !== 0);
  }

  // Build one random fully-solved board.
  function generateSolution() {
    const b = new Array(N * N).fill(0);
    const rowCnt = Array.from({ length: N }, () => [0, 0, 0]);
    const colCnt = Array.from({ length: N }, () => [0, 0, 0]);

    function rec(pos) {
      if (pos === N * N) return true;
      const r = Math.floor(pos / N), c = pos % N;
      const opts = Math.random() < 0.5 ? [SUN, MOON] : [MOON, SUN];
      for (const v of opts) {
        if (ok(b, rowCnt, colCnt, r, c, v)) {
          b[pos] = v; rowCnt[r][v]++; colCnt[c][v]++;
          if (rec(pos + 1)) return true;
          b[pos] = 0; rowCnt[r][v]--; colCnt[c][v]--;
        }
      }
      return false;
    }
    rec(0);
    return b;
  }

  // Create a puzzle: a set of givens + constraints with a unique solution.
  function makePuzzle() {
    const sol = generateSolution();

    // candidate edges (adjacent pairs)
    const edges = [];
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        if (c < N - 1) edges.push([idx(r, c), idx(r, c + 1)]);
        if (r < N - 1) edges.push([idx(r, c), idx(r + 1, c)]);
      }
    }
    shuffle(edges);

    // pick a handful of constraints derived from the solution
    const cons = {};
    const numCons = 7;
    for (let k = 0; k < numCons && k < edges.length; k++) {
      const [a, b] = edges[k];
      cons[conKey(a, b)] = (sol[a] === sol[b]) ? '=' : 'x';
    }

    // Start from the full solution and greedily hide cells, but ONLY while the
    // puzzle stays solvable by pure logic (logicSolve). Because every step of
    // logicSolve is a forced move, a puzzle it can finish is both uniquely
    // solvable AND requires no guessing.
    const givens = sol.slice();
    for (const i of shuffle([...Array(N * N).keys()])) {
      const saved = givens[i];
      givens[i] = 0;
      if (!logicSolve(givens, cons)) givens[i] = saved;
    }
    return { given: givens, cons };
  }

  /* ---------- Rendering ---------- */
  function buildCells() {
    boardEl.querySelectorAll('.t-cell, .t-marker').forEach(e => e.remove());
    cellEls = [];
    for (let i = 0; i < N * N; i++) {
      const el = document.createElement('div');
      el.className = 't-cell';
      el.dataset.index = i;
      el.addEventListener('click', () => onCellClick(i));
      el.addEventListener('contextmenu', e => { e.preventDefault(); onCellRight(i); });
      addLongPress(el, () => onCellRight(i));
      boardEl.appendChild(el);
      cellEls.push(el);
    }
    sizeTangoBoard();
  }

  // Scale the 6x6 board (and cell font) so it always fits the viewport.
  function sizeTangoBoard() {
    const s = boardFit(N, 68, 6, 11, 32);
    boardEl.style.gridTemplateColumns = `repeat(${N}, ${s}px)`;
    boardEl.style.gridTemplateRows = `repeat(${N}, ${s}px)`;
    const fs = Math.max(1.1, s * 0.032).toFixed(2) + 'rem';
    for (const el of cellEls) { el.style.width = s + 'px'; el.style.height = s + 'px'; el.style.fontSize = fs; }
  }

  function buildMarkers() {
    markers.forEach(m => m.el.remove());
    markers = [];
    for (const k in conMap) {
      const [a, b] = k.split('-').map(Number);
      const el = document.createElement('div');
      el.className = 't-marker';
      el.textContent = conMap[k] === '=' ? '=' : '×';
      boardEl.appendChild(el);
      markers.push({ a, b, type: conMap[k], el });
    }
    layoutMarkers();
  }

  function layoutMarkers() {
    for (const m of markers) {
      const a = cellEls[m.a], b = cellEls[m.b];
      const x = (a.offsetLeft + a.offsetWidth / 2 + b.offsetLeft + b.offsetWidth / 2) / 2;
      const y = (a.offsetTop + a.offsetHeight / 2 + b.offsetTop + b.offsetHeight / 2) / 2;
      m.el.style.left = x + 'px';
      m.el.style.top  = y + 'px';
    }
  }

  function renderCell(i) {
    const el = cellEls[i], v = values[i];
    el.textContent = v ? GLYPH[v] : '';
    el.classList.remove('sun', 'moon', 'given', 'error', 'solved');
    if (given[i]) el.classList.add('given');
    if (v === SUN) el.classList.add('sun');
    if (v === MOON) el.classList.add('moon');
  }

  function renderAll() { for (let i = 0; i < N * N; i++) renderCell(i); }

  /* ---------- Validation / feedback ---------- */
  function computeErrors() {
    const bad = new Set();
    // over-count per row/col
    for (let r = 0; r < N; r++) {
      const cnt = [0, 0, 0];
      for (let c = 0; c < N; c++) { const v = values[idx(r, c)]; if (v) cnt[v]++; }
      for (const v of [SUN, MOON]) if (cnt[v] > NEED)
        for (let c = 0; c < N; c++) if (values[idx(r, c)] === v) bad.add(idx(r, c));
    }
    for (let c = 0; c < N; c++) {
      const cnt = [0, 0, 0];
      for (let r = 0; r < N; r++) { const v = values[idx(r, c)]; if (v) cnt[v]++; }
      for (const v of [SUN, MOON]) if (cnt[v] > NEED)
        for (let r = 0; r < N; r++) if (values[idx(r, c)] === v) bad.add(idx(r, c));
    }
    // three-in-a-row
    for (let r = 0; r < N; r++)
      for (let c = 0; c <= N - 3; c++) {
        const a = values[idx(r, c)];
        if (a && a === values[idx(r, c + 1)] && a === values[idx(r, c + 2)])
          bad.add(idx(r, c)).add(idx(r, c + 1)).add(idx(r, c + 2));
      }
    for (let c = 0; c < N; c++)
      for (let r = 0; r <= N - 3; r++) {
        const a = values[idx(r, c)];
        if (a && a === values[idx(r + 1, c)] && a === values[idx(r + 2, c)])
          bad.add(idx(r, c)).add(idx(r + 1, c)).add(idx(r + 2, c));
      }
    // constraint violations (only when both cells filled)
    const badMarkers = new Set();
    for (const m of markers) {
      const va = values[m.a], vb = values[m.b];
      let violated = false;
      if (va && vb) violated = m.type === '=' ? va !== vb : va === vb;
      if (violated) { badMarkers.add(m); bad.add(m.a); bad.add(m.b); }
    }
    return { bad, badMarkers };
  }

  function isSolved() {
    if (values.some(v => v === 0)) return false;
    for (let r = 0; r < N; r++) {
      let s = 0; for (let c = 0; c < N; c++) if (values[idx(r, c)] === SUN) s++;
      if (s !== NEED) return false;
    }
    for (let c = 0; c < N; c++) {
      let s = 0; for (let r = 0; r < N; r++) if (values[idx(r, c)] === SUN) s++;
      if (s !== NEED) return false;
    }
    for (let r = 0; r < N; r++)
      for (let c = 0; c <= N - 3; c++) {
        const a = values[idx(r, c)];
        if (a === values[idx(r, c + 1)] && a === values[idx(r, c + 2)]) return false;
      }
    for (let c = 0; c < N; c++)
      for (let r = 0; r <= N - 3; r++) {
        const a = values[idx(r, c)];
        if (a === values[idx(r + 1, c)] && a === values[idx(r + 2, c)]) return false;
      }
    for (const m of markers) {
      const va = values[m.a], vb = values[m.b];
      if (m.type === '=' ? va !== vb : va === vb) return false;
    }
    return true;
  }

  // Show the red error highlight (called after a short delay, see refresh()).
  function showErrors() {
    errorTimer = null;
    if (solved) return;
    const { bad, badMarkers } = computeErrors();
    for (let i = 0; i < N * N; i++)
      cellEls[i].classList.toggle('error', bad.has(i));
    for (const m of markers) m.el.classList.toggle('bad', badMarkers.has(m));
    const filled = values.filter(v => v).length;
    statusEl.innerHTML = bad.size
      ? `<span style="color:#e94560;font-weight:700">Ima grešaka…</span>`
      : `Popunjeno ${filled} / ${N * N}`;
  }

  function refresh() {
    // Cancel any pending error highlight — the user is still editing.
    if (errorTimer) { clearTimeout(errorTimer); errorTimer = null; }
    // Clear current red so nothing flashes while placing a moon (needs two clicks).
    for (let i = 0; i < N * N; i++) cellEls[i].classList.remove('error');
    for (const m of markers) m.el.classList.remove('bad');

    if (isSolved()) { finish(); return; }

    const { bad } = computeErrors();
    const filled = values.filter(v => v).length;
    statusEl.innerHTML = `Popunjeno ${filled} / ${N * N}`;
    // Delay the red so a quick correction (☀ → ☾) doesn't briefly flash an error.
    if (bad.size) errorTimer = setTimeout(showErrors, 2000);
  }

  function finish() {
    if (solved) return;
    solved = true;
    pauseTimer();
    const ms = elapsed();
    cellEls.forEach(el => el.classList.add('solved'));
    statusEl.innerHTML = `<span style="color:#53d8fb;font-weight:700">Riješeno u ${fmt(ms)}!</span>`;

    finalTime.textContent = fmt(ms);
    let isRecord = false;
    if (best === null || ms < best) {
      best = ms;
      isRecord = true;
      try { localStorage.setItem(BEST_KEY, String(ms)); } catch (e) {}
      renderBest();
    }
    recordEl.textContent = isRecord ? '★ NOVI REKORD ★' : '';
    finalSub.textContent = isRecord
      ? 'Novi najbolji rezultat!'
      : (best !== null ? `Tvoj rekord je ${fmt(best)}.` : 'Bravo!');
    overlay.show(500);
  }

  function renderBest() { bestEl.textContent = best === null ? '—' : fmt(best); }

  /* ---------- Interaction ---------- */
  function place(i, v) {
    if (solved || given[i]) return;
    startTimer();
    values[i] = v;
    renderCell(i);
    cellEls[i].classList.add('pop');
    cellEls[i].addEventListener('animationend', () => cellEls[i].classList.remove('pop'), { once: true });
    refresh();
  }

  // left click: empty -> sun -> moon -> empty
  function onCellClick(i) {
    if (solved || given[i]) return;
    place(i, (values[i] + 1) % 3);
  }

  // right click: toggle the moon directly (moon <-> empty)
  function onCellRight(i) {
    if (solved || given[i]) return;
    place(i, values[i] === MOON ? 0 : MOON);
  }

  function clearBoard() {
    if (solved) return;
    for (let i = 0; i < N * N; i++) if (!given[i]) values[i] = 0;
    renderAll();
    refresh();
  }

  function newPuzzle() {
    if (errorTimer) { clearTimeout(errorTimer); errorTimer = null; }
    const p = makePuzzle();
    given = p.given.slice();
    conMap = p.cons;
    values = given.slice();
    solved = false;
    resetTimer();
    overlay.hide();

    buildCells();
    renderAll();
    buildMarkers();
    statusEl.textContent = 'Klikni ćeliju: ☀ → ☾ → prazno';
  }

  /* ---------- Lifecycle ---------- */
  function init() {
    try {
      const stored = localStorage.getItem(BEST_KEY);
      best = stored === null ? null : Number(stored);
    } catch (e) { best = null; }
    renderBest();
    newPuzzle();
  }

  let initialised = false;
  function onEnter() {
    if (!initialised) { initialised = true; init(); }
    else { layoutMarkers(); resumeTimer(); overlay.resume(); if (started && !solved) refresh(); }
  }
  function onLeave() {
    pauseTimer(); overlay.suspend();
    if (errorTimer) { clearTimeout(errorTimer); errorTimer = null; }
  }

  window.addEventListener('resize', () => { if (cellEls.length) { sizeTangoBoard(); layoutMarkers(); } });

  document.getElementById('t-new').addEventListener('click', newPuzzle);
  document.getElementById('t-clear').addEventListener('click', clearBoard);
  document.getElementById('t-play-again').addEventListener('click', newPuzzle);

  return { onEnter, onLeave };
})();

/* ======================================================================
   MINOLOVAC
   ====================================================================== */
const Mines = (() => {
  const LEVELS = {
    easy:   { rows: 8,  cols: 8,  mines: 10, size: 48, label: 'Lako' },
    medium: { rows: 12, cols: 12, mines: 30, size: 38, label: 'Srednje' },
    hard:   { rows: 16, cols: 16, mines: 50, size: 30, label: 'Teško' }
  };

  // DOM
  const boardEl   = document.getElementById('m-board');
  const minesEl   = document.getElementById('m-mines');
  const timeEl    = document.getElementById('m-time');
  const bestEl    = document.getElementById('m-best');
  const statusEl  = document.getElementById('m-status');
  const revealBtn = document.getElementById('m-mode-reveal');
  const flagModeBtn = document.getElementById('m-mode-flag');
  const overlayEl = document.getElementById('m-overlay');
  const resEmoji  = document.getElementById('m-result-emoji');
  const resTitle  = document.getElementById('m-result-title');
  const finalTime = document.getElementById('m-final-time');
  const recordEl  = document.getElementById('m-record-badge');
  const finalSub  = document.getElementById('m-final-sub');
  const overlay   = delayedOverlay(overlayEl);

  // State
  let level   = 'easy';
  let rows = 0, cols = 0, mineCount = 0;
  let grid = [];                // {mine, adj, revealed, flagged}
  let cellEls = [];
  let firstClick = true;
  let gameOver = false;
  let flags = 0, revealedCount = 0;
  let flagMode = false;
  let mayNeedGuess = false;     // true only if a no-guess board couldn't be found in time
  let best = {};                // per-level ms

  // Timer
  let started = false, running = false, stamp = 0, accrued = 0, ticker = null;
  function elapsed() { return accrued + (running ? Date.now() - stamp : 0); }
  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }
  function renderTime() { timeEl.textContent = fmt(elapsed()); }
  function startTimer() {
    if (running || gameOver) return;
    started = true; running = true; stamp = Date.now();
    ticker = setInterval(renderTime, 250);
  }
  function pauseTimer() {
    if (!running) return;
    accrued += Date.now() - stamp; running = false;
    clearInterval(ticker); ticker = null;
  }
  function resumeTimer() {
    if (running || gameOver || !started) return;
    running = true; stamp = Date.now();
    ticker = setInterval(renderTime, 250);
  }
  function resetTimer() {
    clearInterval(ticker); ticker = null;
    started = false; running = false; accrued = 0; stamp = 0;
    renderTime();
  }

  const idx = (r, c) => r * cols + c;
  const neighbours = i => {
    const r = Math.floor(i / cols), c = i % cols, res = [];
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) res.push(idx(nr, nc));
      }
    return res;
  };

  function renderMines() { minesEl.textContent = mineCount - flags; }
  function renderBest() {
    const b = best[level];
    bestEl.textContent = (b === undefined || b === null) ? '—' : fmt(b);
  }

  /* ---------- Board setup ---------- */
  function buildBoard() {
    boardEl.innerHTML = '';
    boardEl.style.setProperty('--m-size', boardFit(cols, LEVELS[level].size, 2, 7, 12, rows) + 'px');
    boardEl.style.gridTemplateColumns = `repeat(${cols}, var(--m-size))`;
    cellEls = [];
    for (let i = 0; i < rows * cols; i++) {
      const el = document.createElement('div');
      el.className = 'm-cell';
      el.addEventListener('click', () => onReveal(i));
      el.addEventListener('contextmenu', e => { e.preventDefault(); onFlag(i); });
      addLongPress(el, () => onFlag(i));
      boardEl.appendChild(el);
      cellEls.push(el);
    }
  }

  // Adjacency counts for a candidate mine layout (mines get -1, never read).
  function adjFor(mineSet) {
    const a = new Array(rows * cols).fill(0);
    for (let i = 0; i < rows * cols; i++)
      a[i] = mineSet.has(i) ? -1 : neighbours(i).filter(n => mineSet.has(n)).length;
    return a;
  }

  const isSubset = (small, big) => { for (const x of small) if (!big.has(x)) return false; return true; };

  // Can this layout be solved from `start` using ONLY logical deduction (no
  // guessing)? Simulates a solver: flood-reveal, then repeatedly apply
  // single-point, the 1-2 subset rule, and the global mine-count rule.
  function isNoGuess(mineSet, adj, start) {
    const total = rows * cols;
    const state = new Array(total).fill(0);   // 0 unknown, 1 revealed-safe, 2 known-mine

    const revealFlood = i => {
      const stack = [i];
      while (stack.length) {
        const c = stack.pop();
        if (state[c] !== 0 || mineSet.has(c)) continue;
        state[c] = 1;
        if (adj[c] === 0) for (const n of neighbours(c)) if (state[n] === 0) stack.push(n);
      }
    };
    revealFlood(start);

    let changed = true;
    while (changed) {
      changed = false;

      // single-point: a number with all mines found → rest safe; all unknowns are mines → mark
      for (let i = 0; i < total; i++) {
        if (state[i] !== 1 || adj[i] === 0) continue;
        const nb = neighbours(i);
        const unknown = nb.filter(n => state[n] === 0);
        if (!unknown.length) continue;
        const remaining = adj[i] - nb.filter(n => state[n] === 2).length;
        if (remaining === 0) {
          for (const u of unknown) {
            if (state[u] !== 0) continue;
            changed = true;
            if (adj[u] === 0) revealFlood(u); else state[u] = 1;
          }
        } else if (remaining === unknown.length) {
          for (const u of unknown) { state[u] = 2; changed = true; }
        }
      }
      if (changed) continue;

      // subset (1-2) rule: if A's unknowns ⊆ B's, the difference holds (B.mines - A.mines) mines
      const cons = [];
      for (let i = 0; i < total; i++) {
        if (state[i] !== 1 || adj[i] === 0) continue;
        const nb = neighbours(i);
        const unknown = nb.filter(n => state[n] === 0);
        if (!unknown.length) continue;
        cons.push({ cells: new Set(unknown), mines: adj[i] - nb.filter(n => state[n] === 2).length });
      }
      for (const A of cons) {
        for (const B of cons) {
          if (A === B || A.cells.size >= B.cells.size || !isSubset(A.cells, B.cells)) continue;
          const diff = [...B.cells].filter(x => !A.cells.has(x));
          const diffMines = B.mines - A.mines;
          if (diffMines === 0) {
            for (const u of diff) {
              if (state[u] !== 0) continue;
              changed = true;
              if (adj[u] === 0) revealFlood(u); else state[u] = 1;
            }
          } else if (diffMines === diff.length) {
            for (const u of diff) { if (state[u] === 0) { state[u] = 2; changed = true; } }
          }
        }
        if (changed) break;
      }
      if (changed) continue;

      // global count: use total remaining mines vs. remaining unknown cells
      const unknownCells = [];
      let knownMines = 0;
      for (let i = 0; i < total; i++) { if (state[i] === 0) unknownCells.push(i); else if (state[i] === 2) knownMines++; }
      const remainingMines = mineSet.size - knownMines;
      if (unknownCells.length) {
        if (remainingMines === 0) {
          for (const u of unknownCells) {
            if (state[u] !== 0) continue;
            changed = true;
            if (adj[u] === 0) revealFlood(u); else state[u] = 1;
          }
        } else if (remainingMines === unknownCells.length) {
          for (const u of unknownCells) { state[u] = 2; changed = true; }
        }
      }
    }

    for (let i = 0; i < total; i++) if (!mineSet.has(i) && state[i] !== 1) return false;
    return true;
  }

  // Place mines after the first click so it (and its neighbours) are safe, and
  // — preferably — so the whole board is solvable by logic without guessing.
  function placeMines(safe) {
    const safeSet = new Set([safe, ...neighbours(safe)]);
    const pool = [];
    for (let i = 0; i < rows * cols; i++) if (!safeSet.has(i)) pool.push(i);
    const count = Math.min(mineCount, pool.length);
    mineCount = count;                       // in case board was too small

    const sample = () => {
      const p = pool.slice();
      for (let k = 0; k < count; k++) {
        const j = k + Math.floor(Math.random() * (p.length - k));
        [p[k], p[j]] = [p[j], p[k]];
      }
      return new Set(p.slice(0, count));
    };

    let mineSet = null, adj = null;
    mayNeedGuess = false;
    const deadline = Date.now() + 2000;      // best-effort time budget
    while (Date.now() < deadline) {
      const cand = sample();
      const cAdj = adjFor(cand);
      if (isNoGuess(cand, cAdj, safe)) { mineSet = cand; adj = cAdj; break; }
    }
    if (!mineSet) { mineSet = sample(); adj = adjFor(mineSet); mayNeedGuess = true; }

    for (const i of mineSet) grid[i].mine = true;
    for (let i = 0; i < rows * cols; i++) grid[i].adj = adj[i];
    renderMines();
  }

  /* ---------- Rendering a cell ---------- */
  function renderCell(i) {
    const el = cellEls[i], cell = grid[i];
    el.className = 'm-cell';
    el.textContent = '';
    if (cell.flagged && !cell.revealed) { el.classList.add('flag'); el.textContent = '🚩'; return; }
    if (!cell.revealed) return;
    el.classList.add('revealed');
    if (cell.mine) { el.textContent = '💣'; el.classList.add('mine'); return; }
    if (cell.adj > 0) { el.textContent = cell.adj; el.classList.add('n' + cell.adj); }
  }

  /* ---------- Interaction ---------- */
  function onReveal(i) {
    if (gameOver) return;
    const cell = grid[i];
    if (flagMode) { onFlag(i); return; }
    if (cell.flagged || cell.revealed) return;

    if (firstClick) {
      placeMines(i);
      firstClick = false;
      startTimer();
      statusEl.innerHTML = mayNeedGuess
        ? `<span style="color:#f0a500">Napomena: ova ploča možda traži pogađanje.</span>`
        : `<span style="color:#43d17a">Rješivo logikom — bez pogađanja.</span>`;
    }

    if (cell.mine) { lose(i); return; }
    flood(i);
    renderMines();
    if (!gameOver) checkWin();
  }

  function flood(start) {
    const stack = [start];
    while (stack.length) {
      const i = stack.pop();
      const cell = grid[i];
      if (cell.revealed || cell.flagged) continue;
      cell.revealed = true;
      revealedCount++;
      renderCell(i);
      if (cell.adj === 0) for (const n of neighbours(i)) if (!grid[n].revealed) stack.push(n);
    }
  }

  function onFlag(i) {
    if (gameOver || grid[i].revealed) return;
    if (!started && firstClick) startTimer();
    grid[i].flagged = !grid[i].flagged;
    flags += grid[i].flagged ? 1 : -1;
    renderCell(i);
    renderMines();
  }

  /* ---------- End states ---------- */
  function lose(hit) {
    gameOver = true;
    pauseTimer();
    for (let i = 0; i < rows * cols; i++) {
      if (grid[i].mine && !grid[i].flagged) { grid[i].revealed = true; renderCell(i); }
      if (grid[i].flagged && !grid[i].mine) { renderCell(i); cellEls[i].classList.add('wrong'); }
    }
    cellEls[hit].classList.add('exploded');
    statusEl.innerHTML = `<span style="color:#e94560;font-weight:700">Bum! Nagazio si minu.</span>`;
    resEmoji.textContent = '💥';
    resTitle.textContent = 'Kraj igre';
    finalTime.textContent = fmt(elapsed());
    recordEl.textContent = '';
    finalSub.textContent = 'Pokušaj ponovno!';
    overlay.show(500);
  }

  function checkWin() {
    if (revealedCount !== rows * cols - mineCount) return;
    gameOver = true;
    pauseTimer();
    const ms = elapsed();
    // auto-flag remaining mines for a tidy finish
    for (let i = 0; i < rows * cols; i++)
      if (grid[i].mine && !grid[i].flagged) { grid[i].flagged = true; renderCell(i); }
    flags = mineCount; renderMines();
    statusEl.innerHTML = `<span style="color:#53d8fb;font-weight:700">Očišćeno u ${fmt(ms)}!</span>`;

    let isRecord = false;
    const prev = best[level];
    if (prev === undefined || prev === null || ms < prev) {
      best[level] = ms; isRecord = true;
      try { localStorage.setItem('mines-best-' + level, String(ms)); } catch (e) {}
      renderBest();
    }
    resEmoji.textContent = '🎉';
    resTitle.textContent = 'Pobjeda!';
    finalTime.textContent = fmt(ms);
    recordEl.textContent = isRecord ? '★ NOVI REKORD ★' : '';
    finalSub.textContent = isRecord
      ? `Najbolji rezultat za razinu ${LEVELS[level].label}!`
      : (prev != null ? `Rekord (${LEVELS[level].label}): ${fmt(prev)}.` : 'Bravo!');
    overlay.show(500);
  }

  /* ---------- New game ---------- */
  function newGame() {
    const cfg = LEVELS[level];
    rows = cfg.rows; cols = cfg.cols; mineCount = cfg.mines;
    grid = Array.from({ length: rows * cols }, () => ({ mine: false, adj: 0, revealed: false, flagged: false }));
    firstClick = true; gameOver = false;
    flags = 0; revealedCount = 0;
    resetTimer();
    overlay.hide();
    buildBoard();
    renderMines();
    statusEl.textContent = 'Klikni bilo koje polje za početak.';
  }

  function setFlagMode(on) {
    flagMode = on;
    revealBtn.classList.toggle('active', !on);
    flagModeBtn.classList.toggle('active', on);
  }

  /* ---------- Lifecycle ---------- */
  let initialised = false;
  function init() {
    for (const lv of Object.keys(LEVELS)) {
      try {
        const s = localStorage.getItem('mines-best-' + lv);
        best[lv] = s === null ? null : Number(s);
      } catch (e) { best[lv] = null; }
    }
    renderBest();
    newGame();
  }
  function onEnter() {
    if (!initialised) { initialised = true; init(); }
    else { resumeTimer(); overlay.resume(); }
  }
  function onLeave() { pauseTimer(); overlay.suspend(); }

  // level selector
  document.querySelectorAll('#m-levels button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#m-levels button').forEach(b => b.classList.toggle('active', b === btn));
      level = btn.dataset.level;
      renderBest();
      newGame();
    });
  });

  document.getElementById('m-new').addEventListener('click', newGame);
  document.getElementById('m-play-again').addEventListener('click', newGame);
  revealBtn.addEventListener('click', () => setFlagMode(false));
  flagModeBtn.addEventListener('click', () => setFlagMode(true));

  // keep the board fitted to the viewport on rotate / resize
  window.addEventListener('resize', () => {
    if (!cellEls.length || !cols) return;
    boardEl.style.setProperty('--m-size', boardFit(cols, LEVELS[level].size, 2, 7, 12, rows) + 'px');
  });

  return { onEnter, onLeave };
})();

/* ======================================================================
   NEBODERI  (Skyscrapers)
   ====================================================================== */
const Sky = (() => {
  const N = 5;                       // 5x5 grid, heights 1..5

  // all permutations of 1..N, precomputed for the line-based logic solver
  const PERMS = (() => {
    const res = [];
    const perm = (acc, rest) => {
      if (!rest.length) { res.push(acc); return; }
      for (let k = 0; k < rest.length; k++)
        perm(acc.concat(rest[k]), rest.slice(0, k).concat(rest.slice(k + 1)));
    };
    perm([], [1, 2, 3, 4, 5]);
    return res;
  })();

  const idx = (r, c) => r * N + c;
  const shuffle = arr => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };

  // DOM
  const boardEl   = document.getElementById('sky-board');
  const timeEl    = document.getElementById('sky-time');
  const bestEl    = document.getElementById('sky-best');
  const statusEl  = document.getElementById('sky-status');
  const overlayEl = document.getElementById('sky-overlay');
  const finalTime = document.getElementById('sky-final-time');
  const recordEl  = document.getElementById('sky-record-badge');
  const finalSub  = document.getElementById('sky-final-sub');
  const overlay   = delayedOverlay(overlayEl);

  // State
  let cellEls = [];                  // N*N play cells
  let clueEls = { top: [], bottom: [], left: [], right: [] };
  let clues   = { top: [], bottom: [], left: [], right: [] };  // 0 = hidden
  let values  = new Array(N * N).fill(0);
  let solved  = false;
  let mode    = 'classic';           // 'classic' = no-guess, 'pro' = unique-only
  let best    = {};                  // per-mode best ms

  // Timer
  let started = false, running = false, stamp = 0, accrued = 0, ticker = null;
  function elapsed() { return accrued + (running ? Date.now() - stamp : 0); }
  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }
  function renderTime() { timeEl.textContent = fmt(elapsed()); }
  function startTimer() {
    if (running || solved) return;
    started = true; running = true; stamp = Date.now();
    ticker = setInterval(renderTime, 250);
  }
  function pauseTimer() {
    if (!running) return;
    accrued += Date.now() - stamp; running = false;
    clearInterval(ticker); ticker = null;
  }
  function resumeTimer() {
    if (running || solved || !started) return;
    running = true; stamp = Date.now();
    ticker = setInterval(renderTime, 250);
  }
  function resetTimer() {
    clearInterval(ticker); ticker = null;
    started = false; running = false; accrued = 0; stamp = 0;
    renderTime();
  }

  /* ---------- Puzzle logic ---------- */
  // How many buildings are visible when looking along this line of heights.
  function visible(arr) {
    let max = 0, cnt = 0;
    for (const v of arr) if (v > max) { max = v; cnt++; }
    return cnt;
  }

  const lineRow = (b, r) => { const a = []; for (let c = 0; c < N; c++) a.push(b[idx(r, c)]); return a; };
  const lineCol = (b, c) => { const a = []; for (let r = 0; r < N; r++) a.push(b[idx(r, c)]); return a; };

  // Random Latin square: each row/column a permutation of 1..N.
  function generateSolution() {
    const b = new Array(N * N).fill(0);
    const rowUsed = Array.from({ length: N }, () => new Array(N + 1).fill(false));
    const colUsed = Array.from({ length: N }, () => new Array(N + 1).fill(false));
    function rec(pos) {
      if (pos === N * N) return true;
      const r = Math.floor(pos / N), c = pos % N;
      for (const v of shuffle([1, 2, 3, 4, 5])) {
        if (rowUsed[r][v] || colUsed[c][v]) continue;
        b[pos] = v; rowUsed[r][v] = true; colUsed[c][v] = true;
        if (rec(pos + 1)) return true;
        b[pos] = 0; rowUsed[r][v] = false; colUsed[c][v] = false;
      }
      return false;
    }
    rec(0);
    return b;
  }

  // Edge clues for every side of a full solution.
  function computeClues(sol) {
    const c = { top: [], bottom: [], left: [], right: [] };
    for (let i = 0; i < N; i++) {
      const col = lineCol(sol, i), row = lineRow(sol, i);
      c.top[i]    = visible(col);
      c.bottom[i] = visible(col.slice().reverse());
      c.left[i]   = visible(row);
      c.right[i]  = visible(row.slice().reverse());
    }
    return c;
  }

  // Count solutions consistent with the given clues, up to `limit`.
  function countSolutions(cl, limit) {
    const g = new Array(N * N).fill(0);
    const rowUsed = Array.from({ length: N }, () => new Array(N + 1).fill(false));
    const colUsed = Array.from({ length: N }, () => new Array(N + 1).fill(false));
    let count = 0;
    function rec(pos) {
      if (count >= limit) return;
      if (pos === N * N) { count++; return; }
      const r = Math.floor(pos / N), c = pos % N;
      for (let v = 1; v <= N; v++) {
        if (rowUsed[r][v] || colUsed[c][v]) continue;
        g[pos] = v; rowUsed[r][v] = true; colUsed[c][v] = true;
        let good = true;
        if (c === N - 1) {                       // row r complete
          const row = lineRow(g, r);
          if (cl.left[r]  && visible(row) !== cl.left[r]) good = false;
          if (good && cl.right[r] && visible(row.slice().reverse()) !== cl.right[r]) good = false;
        }
        if (good && r === N - 1) {               // column c complete
          const col = lineCol(g, c);
          if (cl.top[c]    && visible(col) !== cl.top[c]) good = false;
          if (good && cl.bottom[c] && visible(col.slice().reverse()) !== cl.bottom[c]) good = false;
        }
        if (good) rec(pos + 1);
        g[pos] = 0; rowUsed[r][v] = false; colUsed[c][v] = false;
        if (count >= limit) return;
      }
    }
    rec(0);
    return count;
  }

  // Solve using ONLY per-line logic: for each row/column, keep the heights that
  // some arrangement (consistent with current candidates + its clues) supports.
  // This never guesses across lines. Returns true iff it fully determines the
  // grid — i.e. the puzzle is solvable without any guessing.
  function logicSolve(cl) {
    const cand = [];
    for (let i = 0; i < N * N; i++) cand.push(new Set([1, 2, 3, 4, 5]));
    const lineCells = (type, i) => {
      const cells = [];
      for (let k = 0; k < N; k++) cells.push(type === 'row' ? idx(i, k) : idx(k, i));
      return cells;
    };
    let changed = true;
    while (changed) {
      changed = false;
      for (const type of ['row', 'col']) {
        for (let i = 0; i < N; i++) {
          const cells = lineCells(type, i);
          const front = type === 'row' ? cl.left[i]  : cl.top[i];
          const back  = type === 'row' ? cl.right[i] : cl.bottom[i];
          const allowed = cells.map(() => new Set());
          let any = false;
          for (const perm of PERMS) {
            let fits = true;
            for (let k = 0; k < N; k++) if (!cand[cells[k]].has(perm[k])) { fits = false; break; }
            if (!fits) continue;
            if (front && visible(perm) !== front) continue;
            if (back && visible(perm.slice().reverse()) !== back) continue;
            any = true;
            for (let k = 0; k < N; k++) allowed[k].add(perm[k]);
          }
          if (!any) return false;                 // no valid arrangement → contradiction
          for (let k = 0; k < N; k++) {
            const c = cells[k];
            for (const v of [...cand[c]]) if (!allowed[k].has(v)) { cand[c].delete(v); changed = true; }
            if (cand[c].size === 0) return false;
          }
        }
      }
    }
    return cand.every(s => s.size === 1);
  }

  // Build a puzzle, keeping as few clues as possible. The acceptance test
  // depends on the mode:
  //   easy    → keep ALL clues on every side (left/right/top/bottom)  [easiest]
  //   classic → must stay solvable by pure logic (logicSolve)  [no guessing]
  //   pro     → must keep a unique solution (countSolutions)   [may need guessing]
  // A logic-solvable puzzle is automatically unique, so classic is the stricter.
  function makePuzzle() {
    if (mode === 'easy') {
      // Every edge clue shown → simplest board; still guaranteed no-guess.
      let c;
      for (let attempt = 0; attempt < 400; attempt++) {
        c = computeClues(generateSolution());
        if (logicSolve(c)) return c;
      }
      return c;   // fallback (extremely rare)
    }
    const classic = mode === 'classic';
    const solvable = cl => classic ? logicSolve(cl) : (countSolutions(cl, 2) === 1);

    let full = null;
    for (let attempt = 0; attempt < 400; attempt++) {
      const c = computeClues(generateSolution());
      if (solvable(c)) { full = c; break; }
    }
    if (!full) full = computeClues(generateSolution());   // fallback (extremely rare)

    const cl = {
      top: full.top.slice(), bottom: full.bottom.slice(),
      left: full.left.slice(), right: full.right.slice()
    };
    const positions = [];
    for (let i = 0; i < N; i++) positions.push(['top', i], ['bottom', i], ['left', i], ['right', i]);
    for (const [side, i] of shuffle(positions)) {
      const saved = cl[side][i];
      cl[side][i] = 0;
      if (!solvable(cl)) cl[side][i] = saved;   // needed → put it back
    }
    return cl;
  }

  /* ---------- Rendering ---------- */
  function buildBoard() {
    boardEl.innerHTML = '';
    cellEls = new Array(N * N);
    clueEls = { top: [], bottom: [], left: [], right: [] };
    const T = N + 2;
    for (let rr = 0; rr < T; rr++) {
      for (let cc = 0; cc < T; cc++) {
        const el = document.createElement('div');
        const edgeR = (rr === 0 || rr === T - 1);
        const edgeC = (cc === 0 || cc === T - 1);
        if (edgeR && edgeC) {
          el.className = 'sky-corner';
        } else if (rr === 0) {
          el.className = 'sky-clue'; clueEls.top[cc - 1] = el;
        } else if (rr === T - 1) {
          el.className = 'sky-clue'; clueEls.bottom[cc - 1] = el;
        } else if (cc === 0) {
          el.className = 'sky-clue'; clueEls.left[rr - 1] = el;
        } else if (cc === T - 1) {
          el.className = 'sky-clue'; clueEls.right[rr - 1] = el;
        } else {
          const i = idx(rr - 1, cc - 1);
          el.className = 'sky-cell';
          el.innerHTML = '<div class="sky-fill"></div><span></span>';
          el.addEventListener('click', () => onCell(i, +1));
          el.addEventListener('contextmenu', e => { e.preventDefault(); onCell(i, -1); });
          addLongPress(el, () => onCell(i, -1));
          cellEls[i] = el;
        }
        boardEl.appendChild(el);
      }
    }
    sizeSkyBoard();
  }

  // Scale the (N+2)x(N+2) board (cells + clue numbers) to fit the viewport.
  function sizeSkyBoard() {
    const s = boardFit(N + 2, 62, 5, 11, 28);
    boardEl.style.gridTemplateColumns = `repeat(${N + 2}, ${s}px)`;
    boardEl.style.gridTemplateRows = `repeat(${N + 2}, ${s}px)`;
    const cf = Math.max(1.0, s * 0.028).toFixed(2) + 'rem';
    const clf = Math.max(0.8, s * 0.02).toFixed(2) + 'rem';
    cellEls.forEach(el => { if (el) el.style.fontSize = cf; });
    for (const side of ['top', 'bottom', 'left', 'right'])
      clueEls[side].forEach(el => { if (el) el.style.fontSize = clf; });
  }

  function renderClues() {
    for (const side of ['top', 'bottom', 'left', 'right'])
      for (let i = 0; i < N; i++) {
        const el = clueEls[side][i], v = clues[side][i];
        el.textContent = v ? v : '';
        el.classList.remove('bad');
      }
  }

  function renderCell(i) {
    const el = cellEls[i], v = values[i];
    el.querySelector('span').textContent = v ? v : '';
    el.querySelector('.sky-fill').style.height = v ? (v / N * 100) + '%' : '0';
  }

  function renderAll() { for (let i = 0; i < N * N; i++) renderCell(i); }

  /* ---------- Validation / feedback ---------- */
  function refresh() {
    const bad = new Set();

    // duplicate heights in a row / column
    for (let r = 0; r < N; r++) {
      const seen = {};
      for (let c = 0; c < N; c++) { const v = values[idx(r, c)]; if (v) (seen[v] = seen[v] || []).push(idx(r, c)); }
      for (const k in seen) if (seen[k].length > 1) seen[k].forEach(x => bad.add(x));
    }
    for (let c = 0; c < N; c++) {
      const seen = {};
      for (let r = 0; r < N; r++) { const v = values[idx(r, c)]; if (v) (seen[v] = seen[v] || []).push(idx(r, c)); }
      for (const k in seen) if (seen[k].length > 1) seen[k].forEach(x => bad.add(x));
    }

    // clue violations — only judge a line once it is completely filled
    let clueBad = false;
    for (let r = 0; r < N; r++) {
      const row = lineRow(values, r), full = row.every(x => x);
      const lb = clues.left[r]  && full && visible(row) !== clues.left[r];
      const rb = clues.right[r] && full && visible(row.slice().reverse()) !== clues.right[r];
      clueEls.left[r].classList.toggle('bad', !!lb);
      clueEls.right[r].classList.toggle('bad', !!rb);
      if (lb || rb) clueBad = true;
    }
    for (let c = 0; c < N; c++) {
      const col = lineCol(values, c), full = col.every(x => x);
      const tb = clues.top[c]    && full && visible(col) !== clues.top[c];
      const bb = clues.bottom[c] && full && visible(col.slice().reverse()) !== clues.bottom[c];
      clueEls.top[c].classList.toggle('bad', !!tb);
      clueEls.bottom[c].classList.toggle('bad', !!bb);
      if (tb || bb) clueBad = true;
    }

    for (let i = 0; i < N * N; i++) cellEls[i].classList.toggle('error', bad.has(i));

    if (isSolved()) {
      finish();
    } else {
      const filled = values.filter(v => v).length;
      statusEl.innerHTML = (bad.size || clueBad)
        ? `<span style="color:#e94560;font-weight:700">Ima grešaka…</span>`
        : `Popunjeno ${filled} / ${N * N}`;
    }
  }

  function isSolved() {
    if (values.some(v => !v)) return false;
    for (let r = 0; r < N; r++) if (new Set(lineRow(values, r)).size !== N) return false;
    for (let c = 0; c < N; c++) if (new Set(lineCol(values, c)).size !== N) return false;
    for (let r = 0; r < N; r++) {
      const row = lineRow(values, r);
      if (clues.left[r]  && visible(row) !== clues.left[r]) return false;
      if (clues.right[r] && visible(row.slice().reverse()) !== clues.right[r]) return false;
    }
    for (let c = 0; c < N; c++) {
      const col = lineCol(values, c);
      if (clues.top[c]    && visible(col) !== clues.top[c]) return false;
      if (clues.bottom[c] && visible(col.slice().reverse()) !== clues.bottom[c]) return false;
    }
    return true;
  }

  function finish() {
    if (solved) return;
    solved = true;
    pauseTimer();
    const ms = elapsed();
    cellEls.forEach(el => el.classList.add('solved'));
    statusEl.innerHTML = `<span style="color:#53d8fb;font-weight:700">Riješeno u ${fmt(ms)}!</span>`;

    finalTime.textContent = fmt(ms);
    let isRecord = false;
    const prev = best[mode];
    if (prev === undefined || prev === null || ms < prev) {
      best[mode] = ms; isRecord = true;
      try { localStorage.setItem('sky-best-' + mode, String(ms)); } catch (e) {}
      renderBest();
    }
    recordEl.textContent = isRecord ? '★ NOVI REKORD ★' : '';
    finalSub.textContent = isRecord
      ? 'Novi najbolji rezultat!'
      : (prev != null ? `Tvoj rekord je ${fmt(prev)}.` : 'Bravo!');
    overlay.show(500);
  }

  function renderBest() {
    const b = best[mode];
    bestEl.textContent = (b === undefined || b === null) ? '—' : fmt(b);
  }

  /* ---------- Interaction ---------- */
  function onCell(i, dir) {
    if (solved) return;
    startTimer();
    values[i] = (values[i] + dir + (N + 1)) % (N + 1);   // cycle 0..N
    renderCell(i);
    refresh();
  }

  function clearBoard() {
    if (solved) return;
    values = new Array(N * N).fill(0);
    renderAll();
    refresh();
  }

  function newPuzzle() {
    clues = makePuzzle();
    values = new Array(N * N).fill(0);
    solved = false;
    resetTimer();
    overlay.hide();
    cellEls.forEach(el => el.classList.remove('solved', 'error'));
    renderClues();
    renderAll();
    statusEl.textContent = 'Klikni polje za visinu (1–' + N + ').';
  }

  /* ---------- Lifecycle ---------- */
  function init() {
    for (const m of ['easy', 'classic', 'pro']) {
      try {
        const s = localStorage.getItem('sky-best-' + m);
        best[m] = s === null ? null : Number(s);
      } catch (e) { best[m] = null; }
    }
    renderBest();
    buildBoard();
    newPuzzle();
  }

  let initialised = false;
  function onEnter() {
    if (!initialised) { initialised = true; init(); }
    else { resumeTimer(); overlay.resume(); }
  }
  function onLeave() { pauseTimer(); overlay.suspend(); }

  // difficulty selector: KLASIČNO (no-guess) / PRO (unique-only)
  document.querySelectorAll('#sky-levels button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#sky-levels button').forEach(b => b.classList.toggle('active', b === btn));
      mode = btn.dataset.mode;
      renderBest();
      newPuzzle();
    });
  });

  document.getElementById('sky-new').addEventListener('click', newPuzzle);
  document.getElementById('sky-clear').addEventListener('click', clearBoard);
  document.getElementById('sky-play-again').addEventListener('click', newPuzzle);

  window.addEventListener('resize', () => { if (cellEls.length) sizeSkyBoard(); });

  return { onEnter, onLeave };
})();

const THEME_KEY = 'igrice-theme';
const lightQuery = window.matchMedia('(prefers-color-scheme: light)');
const themeMeta = document.querySelector('meta[name="theme-color"]');
let themePref = 'auto';
try { themePref = localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) {}
if (!['auto', 'dark', 'light'].includes(themePref)) themePref = 'auto';

function applyTheme() {
  const light = themePref === 'light' || (themePref === 'auto' && lightQuery.matches);
  document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
  themeMeta.setAttribute('content', light ? '#f3f5fa' : '#0d1321');
  document.querySelectorAll('#theme-seg button').forEach(b =>
    b.classList.toggle('active', b.dataset.themePref === themePref));
}
document.querySelectorAll('#theme-seg button').forEach(btn => {
  btn.addEventListener('click', () => {
    themePref = btn.dataset.themePref;
    try { localStorage.setItem(THEME_KEY, themePref); } catch (e) {}
    applyTheme();
  });
});
lightQuery.addEventListener('change', applyTheme);
applyTheme();

const backdrop      = document.getElementById('backdrop');
const settingsSheet = document.getElementById('settings-sheet');
const infoSheet     = document.getElementById('info-sheet');
const btnSettings   = document.getElementById('btn-settings');
const btnInfo       = document.getElementById('btn-info');
const GAME_MODULES  = { tango: Tango, mines: Mines, sky: Sky };
let openSheet = null, openTrigger = null;

// Dok je prozorčić otvoren, mjerač vremena stoji.
function closeSheets() {
  if (!openSheet) return;
  openSheet.classList.remove('open');
  backdrop.classList.remove('open');
  openTrigger.setAttribute('aria-expanded', 'false');
  const trigger = openTrigger;
  openSheet = null; openTrigger = null;
  const mod = GAME_MODULES[activeGame];
  if (mod) mod.onEnter();
  else if (activeGame === 'ttt') tttOverlay.resume();
  trigger.focus({ preventScroll: true });
}

function toggleSheet(sheet, trigger) {
  if (openSheet === sheet) { closeSheets(); return; }
  closeSheets();
  const mod = GAME_MODULES[activeGame];
  if (mod) mod.onLeave();
  openSheet = sheet; openTrigger = trigger;
  sheet.classList.add('open');
  backdrop.classList.add('open');
  trigger.setAttribute('aria-expanded', 'true');
  sheet.querySelector('button.active, .sheet-close').focus({ preventScroll: true });
}

function updateLevelHint() {
  const sel = activeGame === 'mines' ? '#m-levels' : activeGame === 'sky' ? '#sky-levels' : null;
  const b = sel && document.querySelector(sel + ' button.active');
  document.getElementById('level-hint').textContent = b ? b.dataset.hint : '';
}

btnSettings.addEventListener('click', () => { updateLevelHint(); toggleSheet(settingsSheet, btnSettings); });
btnInfo.addEventListener('click', () => {
  const info = INFO[activeGame];
  document.getElementById('info-title').textContent = info.title;
  document.getElementById('info-hint').textContent = info.hint;
  const list = document.getElementById('info-rules');
  list.innerHTML = '';
  for (const r of info.rules) {
    const li = document.createElement('li');
    li.textContent = r;
    list.appendChild(li);
  }
  toggleSheet(infoSheet, btnInfo);
});
backdrop.addEventListener('click', closeSheets);
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheets));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); });

// nova razina odmah pokreće novu igru – prozorčić se zatvori nakon kratke potvrde odabira
document.querySelectorAll('#m-levels button, #sky-levels button').forEach(btn => {
  btn.addEventListener('click', () => { updateLevelHint(); setTimeout(closeSheets, 180); });
});

/* ======================================================================
   BACKGROUND PAUSE  (screen locked / app switched → timers stop)
   ====================================================================== */
document.addEventListener('visibilitychange', () => {
  const game = { tango: Tango, mines: Mines, sky: Sky }[activeGame];
  if (game && (document.hidden || !openSheet)) game[document.hidden ? 'onLeave' : 'onEnter']();
});
